[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zypherdb"
version = "0.1.0"
description = "Python bindings for ZypherDB, an embedded graph database (openCypher on LMDB or libmdbx)"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["zypherdb"]
