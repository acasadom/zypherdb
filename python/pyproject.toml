[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "acmedb"
version = "0.1.0"
description = "Python bindings for acmedb, an embedded graph database (openCypher on LMDB)"
requires-python = ">=3.9"
license = { text = "See the repository LICENSE" }

[tool.setuptools]
packages = ["acmedb"]
