# Weekly: if PyPI has a newer tzdata than vendor/tzdata/, regenerate it and open a pull request.
# Merged, it goes out with the next release; a change to the current rules of a zone may deserve
# a patch release of its own (see vendor/tzdata/README.md).
#
# A pull request opened with GITHUB_TOKEN starts no workflows, so this one dispatches CI on the
# new branch itself (workflow_dispatch is the exception), and the required checks report on it.
# Needs Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
name: tzdata

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Regenerate from the newest wheel, if there is one
        id: update
        run: |
          version=$(python -I tools/tzdata_update.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then zig fmt vendor/tzdata/tzdata.zig; fi

      - name: Open a pull request
        if: steps.update.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          branch="tzdata/$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "$branch exists already"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add vendor/tzdata THIRD_PARTY_NOTICES.md
          git commit -m "chore(tzdata): update the embedded time zone database to $VERSION" \
            -m "Generated by tools/tzdata_update.py from the tzdata $VERSION wheel on PyPI."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update the embedded time zone database to tzdata $VERSION" \
            --body "The tzdata package on PyPI has version $VERSION. This regenerates \`vendor/tzdata/\` with \`tools/tzdata_update.py\`. Before merging, read what changed in the IANA release notes (https://data.iana.org/time-zones/tzdb/NEWS): a change to the current rules of a zone may deserve a patch release."
          gh workflow run ci.yml --ref "$branch"
