name: Publish to PyPI

# Runs when a GitHub release is published: builds and tests the wheels and the sdist (wheels.yml),
# then uploads them to PyPI through Trusted Publishing (no token: PyPI trusts this workflow, in
# the `pypi` environment, of acasadom/zypherdb).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: The release tag names the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release tag $TAG does not match the version in pyproject.toml (v$version)"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/wheels.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/zypherdb
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
