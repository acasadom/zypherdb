name: Publish to PyPI

# Runs when a GitHub release is published: builds and tests the wheels and the sdist (wheels.yml),
# then uploads them to PyPI through Trusted Publishing (no token: PyPI trusts this workflow, in
# the `pypi` environment, of acasadom/zypherdb).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-24.04
    steps:
      # The build takes its version from this tag (git describe), so the tag must be one.
      - name: The release tag is a version (vX.Y.Z)
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::release tag $TAG is not a version vX.Y.Z (or vX.Y.ZrcN)"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/wheels.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/zypherdb
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Every file carries the release's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ls dist
          for file in dist/*; do
            case "$(basename "$file")" in
              "zypherdb-${TAG#v}.tar.gz" | "zypherdb-${TAG#v}-"*.whl) ;;
              *) echo "::error::$file is not version ${TAG#v}"; exit 1 ;;
            esac
          done

      - uses: pypa/gh-action-pypi-publish@release/v1
