name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # tzdata.yml starts CI on the pull requests it opens (theirs start no workflows by themselves)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # A stalled Zig cache download gives up after 2 minutes, not the default
      # 10, and the job goes on with an empty cache (the cache takes seconds).
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Formatting
        if: runner.os == 'Linux'
        run: zig fmt --check src tests bench python/native build.zig

      - name: Zig tests
        run: zig build test --summary all

      # A short run of each fuzzer from a new first seed (the run id); the long runs are
      # in fuzz.yml. Replay a failure with: zig build fuzz -- <fuzzer> --seed <seed>
      - name: Fuzzers (short run)
        run: |
          zig build fuzz -- storage --seed ${{ github.run_id }} --seeds 10 --quiet
          zig build fuzz -- query --seed ${{ github.run_id }} --seeds 10 --quiet
          zig build fuzz -- faults --seed ${{ github.run_id }} --seeds 10 --steps 60 --quiet
          zig build fuzz -- crash --seed ${{ github.run_id }} --seeds 2 --quiet
          zig build fuzz -- replication --seed ${{ github.run_id }} --seeds 10 --quiet

      - name: Build the shared library
        run: zig build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Python extension module
        # (no make on Windows runners: the same command as `make python`)
        run: >-
          zig build python
          -Dpython-include="$(python -c "import sysconfig; print(sysconfig.get_paths()['include'])")"
          -Dpython-libs="$(python -c "import os, sys; print(os.path.join(sys.base_prefix, 'libs'))")"

      - name: Python tests
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest python/tests -q

      - name: openCypher TCK (no regressions against the baseline)
        run: python -I tests/tck/runner.py --check-baseline --report tck-report.md

      - name: TCK report in the job summary
        if: always()
        run: cat tck-report.md >> "$GITHUB_STEP_SUMMARY" || true
