name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Formatting
        run: zig fmt --check src tests bench python/native build.zig

      - name: Zig tests
        run: zig build test --summary all

      - name: Build the shared library
        run: zig build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Python extension module
        run: make python PYTHON=python

      - name: Python tests
        run: |
          python -m pip install -e "python[dev]"
          python -m pytest python/tests -q

      - name: openCypher TCK (no regressions against the baseline)
        run: python -I tests/tck/runner.py --check-baseline --report tck-report.md

      - name: TCK report in the job summary
        if: always()
        run: cat tck-report.md >> "$GITHUB_STEP_SUMMARY" || true
