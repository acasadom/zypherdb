name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Zig tests
        run: zig build test --summary all

      - name: Build the shared library
        run: zig build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests
        run: |
          python -m pip install -e "python[dev]"
          python -m pytest python/tests -q
