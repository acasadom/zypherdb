[build-system]
# An in-tree backend (tools/build_backend) compiles the native module with Zig; it
# asks for the `ziglang` package itself when no Zig of the right version is installed.
requires = ["tomli>=1.1; python_version < '3.11'"]
build-backend = "zypherdb_build"
backend-path = ["tools/build_backend"]

[project]
name = "zypherdb"
version = "0.1.0"
description = "Python bindings for ZypherDB, an embedded graph database (openCypher on LMDB or libmdbx)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# Wheels ship LMDB and the IANA time-zone data; THIRD_PARTY_NOTICES.md covers the rest.
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "vendor/lmdb/LICENSE",
    "vendor/lmdb/COPYRIGHT",
    "vendor/tzdata/LICENSE",
    "vendor/tzdata/LICENSE_APACHE",
]
authors = [{ name = "Alberto Casado" }]
keywords = [
    "graph database", "graph-database",
    "embedded database", "embedded-database",
    "opencypher", "cypher",
    "lmdb", "libmdbx", "zig",
    "full-text search", "access control",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Zig",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

# Windows has no system time-zone database; Python's zoneinfo then reads the IANA data
# from the tzdata package (data only, maintained by CPython's core developers).
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/acasadom/zypherdb"
Repository = "https://github.com/acasadom/zypherdb"
Documentation = "https://acasadom.github.io/zypherdb/"
Issues = "https://github.com/acasadom/zypherdb/issues"
Changelog = "https://github.com/acasadom/zypherdb/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]
